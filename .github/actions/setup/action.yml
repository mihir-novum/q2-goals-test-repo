name: Set up Node and pnpm
description: Install the project Node.js and pnpm dependencies from the lockfile
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version: "22"
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
